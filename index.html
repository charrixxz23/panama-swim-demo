<!doctype html>
<html lang="es-PA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Panamá Swim | Cada segundo cuenta</title>
    <meta name="description" content="Prototipo académico de plataforma para la natación panameña: calendario, resultados, perfiles de nadadores y comparador de marcas mínimas. Datos demostrativos." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Panamá Swim" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PA" />
    <meta property="og:site_name" content="Panamá Swim (demo)" />
    <meta property="og:title" content="Panamá Swim · Cada segundo cuenta" />
    <meta property="og:description" content="Prototipo académico independiente inspirado en la natación panameña." />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello.
      try {
        var t = localStorage.getItem("panama-swim:tema");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Panamá Swim necesita JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
