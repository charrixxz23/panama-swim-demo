name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Probar y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Ruta base y URL pública
        id: site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "base=/${repo}/" >> "$GITHUB_OUTPUT"
          echo "url=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Compilar la aplicación estática
        run: npm run build
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo (escritorio, tableta, Android, iPhone)
        run: npm run test:e2e
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}

      - name: Informe de Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
